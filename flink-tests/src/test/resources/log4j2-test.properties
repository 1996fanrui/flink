# Enable automatic configuration monitoring (checks every 30 seconds)
monitorInterval = 30

# Set root logger level to OFF to not flood build logs
# set manually to INFO for debugging purposes
rootLogger.level = INFO
rootLogger.appenderRef.test.ref = TestLogger

#logger.networkactionslogger.name = org.apache.flink.runtime.io.network.logger.NetworkActionsLogger
#logger.networkactionslogger.level = TRACE

#logger.checkpoint-channel.name = org.apache.flink.runtime.checkpoint.channel
#logger.checkpoint-channel.level = DEBUG
#
#logger.checkpointing.name = org.apache.flink.streaming.runtime.io.checkpointing
#logger.checkpointing.level = DEBUG

appender.testlogger.name = TestLogger
appender.testlogger.type = CONSOLE
appender.testlogger.target = SYSTEM_ERR
appender.testlogger.layout.type = PatternLayout
appender.testlogger.layout.pattern =  %-4r [%-32X{flink-job-id}] %c{0} [%t] %-5p %m%n

logger.migration.name = org.apache.flink.test.migration
logger.migration.level = INFO
